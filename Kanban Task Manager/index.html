<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban Task Manager</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <h1>Kanaban Task Manager</h1>
      </div>
      <button
        class="add-button"
        id="new-task"
        type="button"
        data-bs-toggle="modal"
        data-bs-target="#taskModal"
      >
        <i class="fa-solid fa-plus"></i> Add task
      </button>
    </header>

    <main class="board" id="board">
      <section class="column">
        <header class="column-header">
          <span class="column-icon todo-icon">
            <i class="fa-solid fa-clipboard-list"></i>
          </span>
          <div>
            <h2>To Do</h2>
            <p><span id="todo-count">0</span> tasks</p>
          </div>
        </header>
        <div class="task-list" id="todo-list"></div>
      </section>
      <section class="column">
        <header class="column-header">
          <span class="column-icon progress-icon">
            <i class="fa-solid fa-spinner"></i>
          </span>
          <div>
            <h2>In Progress</h2>
            <p><span id="progress-count">0</span> tasks</p>
          </div>
        </header>
        <div class="task-list" id="progress-list"></div>
      </section>
      <section class="column">
        <header class="column-header">
          <span class="column-icon completed-icon">
            <i class="fa-solid fa-circle-check"></i>
          </span>
          <div>
            <h2>Completed</h2>
            <p><span id="completed-count">0</span> tasks</p>
          </div>
        </header>
        <div class="task-list" id="completed-list"></div>
      </section>
    </main>

    <div
      class="modal fade"
      id="taskModal"
      tabindex="-1"
      aria-labelledby="modal-title"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <form id="task-form">
            <div class="modal-header">
              <div>
                <p class="eyebrow">TASK DETAILS</p>
                <h2 class="modal-title fs-4" id="modal-title">Create task</h2>
              </div>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <div class="mb-3">
                <label class="form-label" for="task-title">Task title</label
                ><input
                  class="form-control"
                  id="task-title"
                  maxlength="80"
                  required
                />
              </div>
              <div class="form-row">
                <div class="mb-3">
                  <label class="form-label" for="task-date">Due date</label
                  ><input
                    class="form-control"
                    id="task-date"
                    type="date"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="task-priority">Priority</label
                  ><select class="form-select" id="task-priority">
                    <option value="low" selected>Low</option>
                    <option value="medium" >Medium</option>
                    <option value="high">High</option>
                  </select>
                </div>
              </div>
              <div>
                <label class="form-label" for="task-description"
                  >Description</label
                ><textarea
                  class="form-control"
                  id="task-description"
                  rows="4"
                  maxlength="400"
                ></textarea>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-light"
                data-bs-dismiss="modal"
              >
                Cancel</button
              ><button class="save-button" id="save-task" type="submit">
                Create task
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script type="module" src="main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
